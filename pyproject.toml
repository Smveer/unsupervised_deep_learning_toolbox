[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unsupervised_deep_learning_toolbox"
version = "0.1.0"
authors = [
    {name = "UDL Toolbox Team", email = "team@udltoolbox.com"}
]
description = "Comprehensive autoencoder implementations with custom loss functions and visualization tools"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tensorflow>=2.13.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipywidgets>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Smveer/unsupervised_deep_learning_toolbox"
Repository = "https://github.com/Smveer/unsupervised_deep_learning_toolbox"
Documentation = "https://github.com/Smveer/unsupervised_deep_learning_toolbox#readme"

[tool.setuptools.packages.find]
include = ["udl_toolbox*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=udl_toolbox --cov-report=html --cov-report=term-missing"